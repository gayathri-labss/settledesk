
services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: settledesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - settledesk-sql-data:/var/opt/mssql
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    container_name: settledesk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - settledesk-kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

  app:
    image: settledesk:dev
    container_name: settledesk-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:sqlserver://database:1433;databaseName=SettleDesk;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_SA_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - database
      - kafka
    restart: unless-stopped

volumes:
  settledesk-sql-data:
    external: true
    name: settledesk-sql-data

  settledesk-kafka-data:
    name: settledesk-kafka-data
