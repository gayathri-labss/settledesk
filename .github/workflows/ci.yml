name: SettleDesk CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settledesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    name: Build, test, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Scan Java dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Build Docker image
        run: docker build --tag settledesk:ci .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: settledesk:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
